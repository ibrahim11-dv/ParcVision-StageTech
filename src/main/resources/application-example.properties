spring.application.name=parcVision
spring.datasource.url=jdbc:postgresql://localhost:5432/parc_vision
spring.datasource.username=USERNAME
spring.datasource.password=PASSWORD
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.security.enabled=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.database=postgresql
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT (À AJOUTER OBLIGATOIREMENT)
jwt.secret=monSuperSecretTresLongPourJWT12345678901234567890
jwt.expiration=86400000